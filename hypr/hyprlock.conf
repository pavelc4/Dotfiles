source = ~/.config/hypr/colors.conf

$text_color = $foreground
$entry_background_color = rgba(20, 20, 25, 0.6)
$entry_border_color = $primary
$entry_color = $foreground
$font_family = JetBrainsMono Nerd Font, Sans
$font_family_clock = JetBrainsMono Nerd Font, Sans

background {
    monitor =
    path = 
    color = $background
    blur_passes = 3
    blur_size = 7
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.3
    outer_color = $entry_border_color
    inner_color = $entry_background_color
    font_color = $entry_color
    fade_on_empty = false
    placeholder_text = <span foreground="##888888">Enter Password...</span>

    position = 0, -50
    halign = center
    valign = center
}

label { # Clock
    monitor =
    text = $TIME
    color = $text_color
    font_size = 64
    font_family = $font_family_clock

    position = 0, 100
    halign = center
    valign = center
}

label { # Date
    monitor =
    text = cmd[update:5000] date +"%A, %B %d"
    color = $primary
    font_size = 18
    font_family = $font_family

    position = 0, 30
    halign = center
    valign = center
}
